<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Alebrillo</title>
<link href="https://fonts.googleapis.com/css2?family=Chango&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d2a12;--ink:#f6f2ea;--dim:#c9c2d8;--cy:#3df2e0;--mg:#ff4fd8;--am:#ffc94d;--or:#ff8a1f;--lime:#9dff6a;--red:#ff4f7a;--panel:rgba(26,16,40,.84);--line:rgba(255,220,180,.28);--f1:'Chango',system-ui,sans-serif;--f2:'Nunito',system-ui,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f2);font-weight:600;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0}
[hidden]{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none}
#topL{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);width:min(250px,56vw)}
#who{display:flex;flex-direction:column;margin-bottom:6px;text-shadow:0 0 6px #000,0 0 2px #000}
#who b{font-family:var(--f1);font-size:17px;font-weight:400;letter-spacing:.3px}
#who span{font-size:12px;color:var(--am)}
.bar{position:relative;height:13px;border-radius:9px;background:rgba(0,0,0,.35);overflow:hidden;margin-bottom:5px;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;width:100%;border-radius:9px;transition:width .12s}
.bar span{position:absolute;left:8px;top:-1px;font-size:10px;line-height:14px;color:#fff;text-shadow:0 0 4px #000}
.bar.luz i{background:linear-gradient(90deg,#ff3d6e,#ff9d3d)}
.bar.xp i{background:linear-gradient(90deg,var(--mg),var(--am))}
.bar.luz.low{animation:pulse .6s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 14px 2px #ff5a3d}}
#goal{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 9px;font-size:12px;line-height:1.25}
#goal small{display:block;color:var(--am);font-size:10px;margin-bottom:2px}
#goal.warn{border-color:var(--red);box-shadow:0 0 14px rgba(255,79,122,.55)}
#topR{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:auto}
#lum,#dn{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:14px;font-weight:800;color:var(--am)}
#dn{font-size:12px;color:var(--ink)}
.rnd{background:var(--panel);border:1px solid var(--line);width:34px;height:34px;border-radius:50%;font-size:15px;font-weight:800}
#combo{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 168px);text-align:right;font-family:var(--f1);font-size:19px;color:var(--am);text-shadow:0 0 10px #000,0 0 14px #ff9d00;opacity:0;transition:opacity .2s}
#combo small{display:block;font-family:var(--f2);font-size:11px;color:#fff}
#combo u{display:block;height:4px;border-radius:3px;background:var(--am);margin-top:3px;margin-left:auto;text-decoration:none}
#zone{position:absolute;left:0;right:0;top:15%;text-align:center;font-family:var(--f1);font-size:clamp(20px,5vw,32px);opacity:0;text-shadow:0 0 12px #000,0 0 22px var(--or);pointer-events:none}
#zone.show{animation:zin 3.6s ease-out}
#zone small{display:block;margin-top:4px;font-family:var(--f2);font-weight:800;font-size:13px;color:var(--am)}
@keyframes zin{0%{opacity:0;transform:translateY(-8px)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 122px);max-width:min(480px,90vw);background:var(--panel);border:1px solid var(--am);border-radius:18px;padding:10px 16px;text-align:center;font-size:15px;font-weight:800;box-shadow:0 0 22px rgba(255,201,77,.35);pointer-events:auto}
#hint button{display:block;margin:6px auto 0;background:none;font-size:11px;color:var(--dim);text-decoration:underline}
#btns{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;gap:14px;align-items:flex-end}
.rb{width:80px;height:80px;border-radius:50%;font-size:12px;font-weight:800;line-height:1.1;touch-action:none}
#bLunge{width:96px;height:96px;font-size:13px;background:conic-gradient(rgba(255,138,31,.7) var(--en,360deg),var(--panel) 0);box-shadow:inset 0 0 0 3px var(--or),0 0 18px rgba(255,138,31,.45)}
#bLunge.ready{box-shadow:inset 0 0 0 3px var(--or),0 0 26px 3px rgba(255,138,31,.7)}
#bSkill{background:conic-gradient(rgba(255,79,216,.55) var(--cd,0deg),var(--panel) 0);box-shadow:inset 0 0 0 2px var(--mg),0 0 18px rgba(255,79,216,.45)}
#bSkill.ready{animation:rdy 1.2s infinite alternate}
@keyframes rdy{to{box-shadow:inset 0 0 0 2px var(--mg),0 0 30px 4px rgba(255,79,216,.8)}}
@media (pointer:fine){#btns{opacity:.85}}
#joy{position:fixed;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.06);pointer-events:none}
#joy i{position:absolute;left:30px;top:30px;width:36px;height:36px;border-radius:50%;background:rgba(255,201,77,.4);box-shadow:0 0 10px rgba(255,201,77,.5)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:21%;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:88vw}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px 12px;font-size:12.5px;font-weight:800;text-align:center;animation:tin .3s,tout .5s 2.2s forwards}
.toast.gold{border-color:var(--am);color:var(--am);box-shadow:0 0 18px rgba(255,201,77,.4)}
.toast.big{border-color:var(--mg);font-family:var(--f1);font-weight:400;font-size:14px;box-shadow:0 0 24px rgba(255,79,216,.5)}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.9)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .7s}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);background:radial-gradient(ellipse at 50% 30%,rgba(20,10,30,.25),rgba(20,10,30,.8))}
.panel{width:min(460px,100%);max-height:100%;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:18px 18px 16px;text-align:center;backdrop-filter:blur(6px);box-shadow:0 0 60px rgba(255,138,31,.2);touch-action:pan-y}
#logo{margin:0;font-family:var(--f1);font-weight:400;font-size:clamp(38px,11vw,56px);line-height:1;letter-spacing:1px}
#logo span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.tag{margin:6px 0 12px;color:var(--dim);font-size:14px}
#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:rgba(255,255,255,.06);border-radius:18px;padding:6px 4px 8px;box-shadow:inset 0 0 0 1px var(--line);transition:transform .15s}
.card.sel{box-shadow:inset 0 0 0 2px var(--am),0 0 22px rgba(255,201,77,.45);transform:translateY(-3px)}
.card canvas{width:100%;aspect-ratio:1;display:block}
.card b{display:block;font-size:13px;margin-top:-2px}
#cdesc{min-height:34px;margin:8px 0 6px;font-size:13px;color:var(--dim)}
#cdesc em{font-style:normal;color:var(--mg);font-weight:800}
.row{display:flex;gap:8px;margin-bottom:10px}
#name{flex:1;min-width:0;font:inherit;font-weight:800;font-size:16px;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;padding:10px 14px;outline:none;user-select:text;-webkit-user-select:text}
#name:focus{border-color:var(--am);box-shadow:0 0 14px rgba(255,201,77,.4)}
#dice{width:46px;border-radius:14px;background:rgba(255,255,255,.1);font-size:20px}
#skins{display:flex;justify-content:center;gap:10px;margin-bottom:12px}
.sk{width:52px;height:52px;border-radius:50%;position:relative;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.sk.sel{box-shadow:inset 0 0 0 3px #fff,0 0 16px currentColor}
.sk small{position:absolute;inset:0;border-radius:50%;background:rgba(20,10,30,.7);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--am)}
.go{width:100%;padding:14px;border-radius:18px;font-family:var(--f1);font-size:20px;color:#2a0d00;background:linear-gradient(90deg,var(--am),var(--or));box-shadow:0 0 28px rgba(255,138,31,.55)}
.go.alt{margin-top:8px;background:rgba(255,255,255,.1);color:var(--ink);box-shadow:none;font-size:15px;padding:10px;font-family:var(--f2);font-weight:800}
#stats{margin:10px 0 0;font-size:12px;color:var(--dim)}
#dead h2{margin:0 0 4px;font-family:var(--f1);font-weight:400;font-size:28px}
#dstats{margin:10px 0 14px;font-size:15px;line-height:1.6}
#dstats b{color:var(--am)}
#dstats .near{display:block;margin-top:8px;color:var(--mg);font-weight:800}
#help .panel{text-align:left}
#help h2{margin:0 0 6px;text-align:center;font-family:var(--f1);font-weight:400;font-size:24px}
#help h3{margin:14px 0 4px;font-family:var(--f1);font-weight:400;font-size:15px;color:var(--am)}
#help p{margin:4px 0;font-size:13px;line-height:1.35}
.hrow{display:flex;gap:10px;align-items:center;margin:6px 0;font-size:13px;line-height:1.3}
.hrow svg{flex:none}
.chip{flex:none;width:44px;height:12px;border-radius:7px;box-shadow:inset 0 0 0 1px var(--line)}
.forms{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px;line-height:1.3}
.forms b{color:var(--am)}
#help .go{margin-top:14px}
#choose h2{margin:0 0 4px;font-family:var(--f1);font-weight:400;font-size:24px}
#choose p{margin:0 0 12px;color:var(--dim);font-size:13px}
#chC{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chc{background:rgba(255,255,255,.06);border-radius:18px;padding:8px 8px 12px;box-shadow:inset 0 0 0 2px var(--line)}
.chc:active{box-shadow:inset 0 0 0 3px var(--am)}
.chc canvas{width:100%;aspect-ratio:1;display:block}
.chc b{display:block;font-family:var(--f1);font-weight:400;font-size:18px;color:var(--am)}
.chc span{display:block;font-size:12px;line-height:1.3;margin-top:4px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" hidden>
  <div id="topL">
    <div id="who"><b id="pname"></b><span id="ptier"></span></div>
    <div class="bar luz" id="luzEl"><i id="bLuz"></i><span>Vida</span></div>
    <div class="bar xp"><i id="bXp"></i><span id="lvl"></span></div>
    <div id="goal"><small id="gz"></small><span id="gt"></span></div>
  </div>
  <div id="topR"><div id="lum">0</div><div id="dn">☀️ Día</div><button class="rnd" id="mute" aria-label="Sonido">♪</button><button class="rnd" id="helpBtn" aria-label="Cómo se juega">?</button></div>
  <div id="combo"><span id="cmul"></span><small>racha</small><u id="cbar"></u></div>
  <div id="zone"></div>
</div>
<div id="hint" hidden><span id="htxt"></span><button id="skipTut">Saltar guía</button></div>
<div id="joy" hidden><i></i></div>
<div id="btns" hidden><button class="rb" id="bSkill">Habilidad</button><button class="rb" id="bLunge">Embestida</button></div>
<div id="toasts"></div>
<div id="flash"></div>

<div class="ov" id="menu">
  <div class="panel">
    <h1 id="logo" aria-label="Alebrillo"></h1>
    <p class="tag">Naces ajolotito. Caza, transfórmate en jaguar, águila… y vuélvete leyenda.</p>
    <div id="cards"></div>
    <p id="cdesc"></p>
    <div class="row"><input id="name" maxlength="14" placeholder="Nombre de tu alebrije" autocomplete="off"><button id="dice" aria-label="Nombre al azar">🎲</button></div>
    <div id="skins"></div>
    <button class="go" id="go">¡A jugar!</button>
    <button class="go alt" id="howto">¿Cómo se juega?</button>
    <p id="stats"></p>
  </div>
</div>

<div class="ov" id="dead" hidden>
  <div class="panel">
    <h2>¡Te atraparon!</h2>
    <div id="dstats"></div>
    <button class="go" id="again">Otra partida</button>
    <button class="go alt" id="tomenu">Cambiar tona o color</button>
  </div>
</div>

<div class="ov" id="help" hidden><div class="panel" id="helpBody"></div></div>
<div class="ov" id="choose" hidden><div class="panel"><h2>¡Elige tu camino!</h2><p>Tu alebrije puede transformarse de dos maneras</p><div id="chC"></div></div></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#c');let ctx=cv.getContext('2d');const MAIN=ctx;
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px'}
addEventListener('resize',resize);resize();
const isTouch=matchMedia('(pointer:coarse)').matches;

/* ---------- utilidades ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const hs=(h,s,l,a=1)=>`hsla(${((h%360)+360)%360|0},${clamp(s,0,100)}%,${clamp(l,0,100)}%,${a})`;
const lerpA=(a,b,t)=>{const d=((b-a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;return a+d*Math.min(1,t)};
const sm=t=>t*t*(3-2*t);
function hsl2rgb(h,s,l){h=((h%360)+360)%360;s/=100;l/=100;const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return(l-a*Math.max(-1,Math.min(k-3,9-k,1)))*255};return[f(0),f(8),f(4)]}
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mixc=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const hq=h=>(Math.round((((h%360)+360)%360)/10)*10)%360;
const spr={},osp={};let GLW=1;
function glow(h){h=hq(h);if(spr[h])return spr[h];const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,hs(h,100,88,1));gr.addColorStop(.22,hs(h,100,62,.75));gr.addColorStop(1,hs(h,100,50,0));g.fillStyle=gr;g.fillRect(0,0,64,64);return spr[h]=c}
function glowAt(x,y,r,h,a){const o=ctx.globalCompositeOperation,al=ctx.globalAlpha;ctx.globalCompositeOperation='lighter';ctx.globalAlpha=clamp(a*GLW,0,1);ctx.drawImage(glow(h),x-r,y-r,r*2,r*2);ctx.globalCompositeOperation=o;ctx.globalAlpha=al}
function orb(h){h=hq(h);if(osp[h])return osp[h];const c=document.createElement('canvas');c.width=c.height=48;const g=c.getContext('2d');const gr=g.createRadialGradient(17,15,2,24,24,23);gr.addColorStop(0,hs(h,60,96));gr.addColorStop(.35,hs(h,90,64));gr.addColorStop(1,hs(h,95,32));g.fillStyle=gr;g.beginPath();g.arc(24,24,23,0,6.3);g.fill();g.fillStyle='rgba(255,255,255,.7)';g.beginPath();g.ellipse(16,13,7,4,-.6,0,6.3);g.fill();return osp[h]=c}
function orbAt(x,y,r,h,a=1){const al=ctx.globalAlpha;ctx.globalAlpha=al*a;ctx.drawImage(orb(h),x-r,y-r,r*2,r*2);ctx.globalAlpha=al}
function ball(cx,cy,rx,ry,h,s,l,a,lx,ly){
  const g=ctx.createRadialGradient(cx+lx*rx*.45,cy+ly*ry*.45,Math.min(rx,ry)*.08,cx,cy,Math.max(rx,ry)*1.1);
  g.addColorStop(0,hs(h,s-15,Math.min(92,l+30),a));g.addColorStop(.5,hs(h,s,l,a));g.addColorStop(1,hs(h,s+5,Math.max(8,l-24),a));
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,6.3);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.ellipse(cx+lx*rx*.5,cy+ly*ry*.5,rx*.2,ry*.12,Math.atan2(ly,lx),0,6.3);ctx.fill();
}
function tube(path,w,h,s,l,lx,ly){
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle=hs(h,s,l-20);ctx.lineWidth=w;path();ctx.stroke();
  ctx.save();ctx.translate(lx*w*.14,ly*w*.14);ctx.strokeStyle=hs(h,s-10,l+10);ctx.lineWidth=w*.55;path();ctx.stroke();
  ctx.translate(lx*w*.12,ly*w*.12);ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=w*.14;path();ctx.stroke();ctx.restore();
}
function gem(x,y,s,h){
  ctx.fillStyle=hs(h,90,78);ctx.beginPath();ctx.moveTo(x,y-s*1.3);ctx.lineTo(x-s*.8,y);ctx.lineTo(x,y+s*1.3);ctx.closePath();ctx.fill();
  ctx.fillStyle=hs(h,95,48);ctx.beginPath();ctx.moveTo(x,y-s*1.3);ctx.lineTo(x+s*.8,y);ctx.lineTo(x,y+s*1.3);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=Math.max(1,s*.12);ctx.beginPath();ctx.moveTo(x,y-s*1.3);ctx.lineTo(x,y+s*1.3);ctx.stroke();
}
function hash(a,b){let h=(a*374761393+b*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return(h^(h>>>16))>>>0}

/* ---------- datos ---------- */
const KEY='alebrillo.v1';
let save={name:'',species:0,skin:0,skins:{0:1},lumens:0,best:1,bestZi:0,medals:{},zones:{},tut3:false,seenHelp4:false,muted:false,kills:0,chests:0,drink:0,kinds:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');Object.assign(save,s)}catch(e){}
if(!save.kinds)save.kinds={};if(save.species>2)save.species=0;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
const ZW=2400,WH=1700,CW=1200;
const ZONES=[
 {n:'Milpa florida',d:[80,46,46],nt:[232,45,14],zt:1,o:0,tip:'Caza chapulines y mariposas entre el maíz'},
 {n:'Pueblo de colores',d:[24,34,62],nt:[240,30,15],zt:2,o:-1,tip:'Perros, gatos y palomas. La fuente y los tamales te curan'},
 {n:'Selva de ceibas',d:[128,42,32],nt:[185,50,12],zt:3,o:1,tip:'Las guacamayas son rápidas: ¡embístelas! Los mangos curan'},
 {n:'Cenote turquesa',d:[172,48,38],nt:[205,60,13],zt:3,o:2,tip:'Peces en el agua; las tortugas aguantan 2 golpes'},
 {n:'Desierto de nopales',d:[34,55,56],nt:[258,35,15],zt:4,o:3,tip:'¡Ojo con los alacranes! Solo tu embestida los vence'},
 {n:'Volcán de obsidiana',d:[14,24,28],nt:[350,45,10],zt:5,o:4,tip:'Tortugas de piedra y alacranes: zona de valientes'},
 {n:'Cielo de papel picado',d:[198,60,60],nt:[262,50,15],zt:6,o:5,tip:'Entre nubes viven los alebrijes más fuertes'}];
const NZ=ZONES.length,OZ=zi=>ZONES[zi%NZ].o;
const FORMS={ajolote:{n:'Ajolotito',t:'Nada el doble de rápido en el agua',tier:1,spd:1},
 lagartijo:{n:'Lagartijo',t:'Muy veloz y ágil',tier:2,spd:1.13},
 gatito:{n:'Michi',t:'Salto felino: su embestida llega más lejos',tier:2,spd:1.06},
 armadillo:{n:'Armadillo',t:'Coraza: recibe menos daño',tier:3,spd:1},
 jaguar:{n:'Jaguar',t:'Embestida feroz que pega más fuerte',tier:4,spd:1.03},
 xolo:{n:'Xolo',t:'Olfato: atrae comida de lejos y corre más',tier:4,spd:1.1},
 aguila:{n:'Águila',t:'Vuela: el aire pesado casi no le afecta',tier:5,spd:1.1},

  if(P&&!tut.on&&!threat&&P.tier>=zTier(zoneIdx(P.x)+1)){const a=.5+.4*Math.sin(T*4);ctx.fillStyle=`rgba(255,201,77,${a})`;ctx.beginPath();const ex=W-14-(Math.sin(T*4)+1)*4,ey=H*.5;ctx.moveTo(ex+10,ey);ctx.lineTo(ex-8,ey-16);ctx.lineTo(ex-8,ey+16);ctx.fill()}
}

/* ---------- HUD ---------- */
const last={};
function setT(id,t){if(last[id]!==t){last[id]=t;$('#'+id).textContent=t}}
function hud(){
  setT('lum','✦ '+save.lumens);setT('dn',isNight?'🌙 Noche':'☀️ Día');
  if(!P)return;
  $('#bLuz').style.width=(P.luz/P.maxLuz*100)+'%';$('#bXp').style.width=(P.xp/need(P.lvl)*100)+'%';
  $('#luzEl').classList.toggle('low',P.luz<P.maxLuz*.3);
  setT('pname',P.name);setT('ptier',`${fName(P)} · ${SP[P.sp].n}`);setT('lvl','Nivel '+P.lvl);
  const c=$('#combo');if(combo>=2){c.style.opacity=1;setT('cmul','x'+(1+Math.min(combo,12)*.1).toFixed(1)+(P.buff>0?' ✦':''));$('#cbar').style.width=(comboT/3*80)+'px'}else c.style.opacity=0;
  const sk=$('#bSkill');sk.style.setProperty('--cd',(P.cd>0?(1-P.cd/SP[P.sp].cd):1)*360+'deg');sk.classList.toggle('ready',P.cd<=0);setT('bSkill',SP[P.sp].skill);
  const bl=$('#bLunge');bl.style.setProperty('--en',(P.en/100*360)+'deg');bl.classList.toggle('ready',P.en>=lungeCost()&&P.lcd<=0);
}

/* ---------- ayuda ---------- */
function auraSvg(k){
  let s='<svg width="46" height="46" viewBox="-23 -23 46 46"><circle r="7" fill="#9a8fb8"/>';
  if(k==='p')for(let i=0;i<8;i++){const a=i/8*6.283;s+=`<circle cx="${(Math.cos(a)*16).toFixed(1)}" cy="${(Math.sin(a)*16).toFixed(1)}" r="2.8" fill="#9dff6a"/>`}
  else if(k==='d')for(let i=0;i<10;i++){const a=i/10*6.283;s+=`<polygon points="${(Math.cos(a)*10).toFixed(1)},${(Math.sin(a)*10).toFixed(1)} ${(Math.cos(a+.15)*21).toFixed(1)},${(Math.sin(a+.15)*21).toFixed(1)} ${(Math.cos(a+.3)*10).toFixed(1)},${(Math.sin(a+.3)*10).toFixed(1)}" fill="#ff4f7a"/>`}
  else s+='<circle r="13" fill="none" stroke="#ffc94d" stroke-width="2"/><circle r="17" fill="none" stroke="#ffc94d" stroke-width="2"/>';
  return s+'</svg>';
}
function buildHelp(){
  $('#helpBody').innerHTML=`<h2>Cómo se juega</h2>
<h3>Tu meta</h3><p>Caza, come y transfórmate en animales cada vez más fuertes. Avanza a la <b>derecha →</b>: cada 6 zonas llegas a un mundo nuevo.</p>
<h3>Tus transformaciones</h3><div class="forms">${ORDER.map(k=>`<b>${FORMS[k].n}</b><span>nivel ${LV[FORMS[k].tier-1]} · ${FORMS[k].t}</span>`).join('')}</div><p>En nivel ${LV[1]} y nivel ${LV[3]} eliges tu camino entre dos animales.</p>
<h3>Embestida</h3><p>Te lanzas rápido hacia donde vas. Caza animalitos, pelea con los de tu tamaño y vence a alacranes y tortugas. Gasta energía (el círculo naranja del botón) y se recarga sola.</p>
<h3>¿Quién puede lastimarte?</h3>
<div class="hrow">${auraSvg('p')}<span><b>Burbujas verdes:</b> es más chico que tú. ¡Cázalo!</span></div>
<div class="hrow">${auraSvg('d')}<span><b>Espinas rojas:</b> te hace daño. ¡Huye! Su nombre sale en rojo con ⚠.</span></div>
<div class="hrow">${auraSvg('e')}<span><b>Anillo dorado:</b> es de tu tamaño. Si se lanza contra ti verás un <b>!</b>: esquívalo y respóndele con tu embestida.</span></div>
<h3>Comida que cura</h3><p>Además del agua, busca elotes, tamales, conchas, mangos y horchata: te devuelven mucha vida. En el Pueblo de colores la fuente también te cura.</p>
<h3>Día y noche</h3><p>De día salen más animalitos. De noche la comida brilla y vale más, pero aparecen murciélagos.</p>
<h3>Tus barras</h3>
<div class="hrow"><i class="chip" style="background:linear-gradient(90deg,#ff3d6e,#ff9d3d)"></i><span><b>Vida.</b> Baja poco a poco y con golpes. Se recupera en el 💧 agua, con flores y comiendo.</span></div>
<div class="hrow"><i class="chip" style="background:linear-gradient(90deg,#ff4fd8,#ffc94d)"></i><span><b>Nivel.</b> Al llenarla subes de nivel y, en ciertos niveles, te transformas.</span></div>
<h3>Controles</h3><p>${isTouch?'Arrastra el dedo en la parte izquierda para moverte. Toca <b>Embestida</b> (o cualquier parte del lado derecho) para lanzarte, y el botón de tu tona para su poder.':'Mouse o WASD para moverte. <b>Clic</b> o <b>Espacio</b> = embestida. <b>E</b> o clic derecho = poder de tu tona.'}</p>
<button class="go" id="helpOk">¡Entendido!</button>`;
  $('#helpOk').onclick=closeHelp;
}
function openHelp(){$('#help').hidden=false;if(state==='play')paused=true}
function closeHelp(){$('#help').hidden=true;paused=false;if(!save.seenHelp4){save.seenHelp4=true;persist()}}

/* ---------- menú ---------- */
const cards=[];
function buildMenu(){
  const lg=$('#logo');'Alebrillo'.split('').forEach((ch,i)=>{const s=document.createElement('span');s.textContent=ch;const h=[330,38,188,300,48,120,20,280,170][i];s.style.color=hs(h,95,62);s.style.textShadow=`0 3px 0 ${hs(h,80,28)},0 0 14px ${hs(h,100,50,.6)}`;s.style.animationDelay=(i*.15)+'s';lg.appendChild(s)});
  const cw=$('#cards');SP.forEach((s,i)=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<canvas width="150" height="150"></canvas><b>${s.s}</b>`;b.onclick=()=>{save.species=i;sel()};cw.appendChild(b);cards.push({b,g:b.querySelector('canvas').getContext('2d')})});
  const sw=$('#skins');SKINS.forEach((k,i)=>{const b=document.createElement('button');b.className='sk';b.title=k.n;b.onclick=()=>{if(save.skins[i]){save.skin=i;sel();persist()}else if(save.lumens>=k.c){save.lumens-=k.c;save.skins[i]=1;save.skin=i;persist();sel();toast(`¡Color ${k.n} desbloqueado!`,'gold')}else toast(`Te faltan ${k.c-save.lumens} lumens para ${k.n}`)};sw.appendChild(b)});
  $('#name').value=save.name||BN[ri(0,BN.length-1)];
  $('#dice').onclick=()=>{$('#name').value=BN[ri(0,BN.length-1)]};
  $('#go').onclick=startRun;$('#howto').onclick=openHelp;$('#helpBtn').onclick=openHelp;
  $('#again').onclick=()=>{$('#dead').hidden=true;startRun()};$('#tomenu').onclick=()=>{$('#dead').hidden=true;showMenu()};
  $('#mute').onclick=()=>{save.muted=!save.muted;if(master)master.gain.value=save.muted?0:.5;$('#mute').textContent=save.muted?'×':'♪';persist()};
  $('#mute').textContent=save.muted?'×':'♪';
  buildHelp();sel();
}
function sel(){
  cards.forEach((c,i)=>c.b.classList.toggle('sel',i===save.species));
  $('#cdesc').innerHTML=`<b>${SP[save.species].n}</b> · <em>${SP[save.species].skill}:</em> ${SP[save.species].d}`;
  [...$('#skins').children].forEach((b,i)=>{const hue=SP[save.species].h+SKINS[i].o;b.style.background=`radial-gradient(circle at 35% 30%,${hs(hue,100,80)},${hs(hue,90,45)})`;b.style.color=hs(hue,100,60);b.classList.toggle('sel',i===save.skin);b.innerHTML=save.skins[i]?'':`<small>✦${SKINS[i].c}</small>`});
  $('#stats').textContent=`Lumens ✦ ${save.lumens}  ·  Mejor nivel ${save.best}  ·  Más lejos: Mundo ${worldOf(save.bestZi)}  ·  Medallas ${Object.keys(save.medals).length}/${Object.keys(MED).length}`;
}
function drawPreviews(t){
  cards.forEach((c,i)=>drawPrev(c.g,ORDER[(Math.floor(t/1.8)+i*3)%ORDER.length],i,SP[i].h+SKINS[save.skin].o,t));
  ctx=MAIN;
}
function drawPrev(g,fm,sp,h,t){ctx=g;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,150,150);GLW=1;const r=fm==='aguila'?17:fm==='serpluma'?16:24,xo={serpluma:1.2,lagartijo:.8,ajolote:.4,gatito:.5,xolo:.3,jaguar:.3}[fm]||0;
  drawCreature({x:75+r*xo,y:74,r,sp,tier:FORMS[fm].tier,form:fm,ang:-.35+Math.sin(t*1.5+sp)*.12,h,ph:sp,stun:0,inv:0,anim:t*5},t);ctx=MAIN}
function drawChoose(t){if(!P)return;chCards.forEach(c=>drawPrev(c.g,c.k,P.sp,P.h,t))}
function showMenu(){state='menu';P=null;threat=null;paused=false;$('#menu').hidden=false;$('#hud').hidden=true;$('#btns').hidden=true;$('#hint').hidden=true;resetWorld(1400);cam.x=1400;cam.y=WH/2;sel()}
function startRun(){
  audio();let nm=$('#name').value.trim().slice(0,14);if(!nm)nm=BN[ri(0,BN.length-1)];save.name=nm;persist();
  clock=0;N=0;isNight=false;nightStart=-1;
  const sp=save.species;resetWorld(700);
  P=mk(sp,1,700,WH/2,false,SP[sp].h+SKINS[save.skin].o);
  Object.assign(P,{name:nm,lvl:1,xp:0,luz:100,maxLuz:100,en:100,cd:0,buff:0,magT:0,fast:0,kills:0,maxCombo:0,far:0,seenZ:{},isBot:false});
  combo=0;comboT=0;lastZone=-1;evT=rnd(55,75);rain=0;chestT=12;PT=[];TX=[];threat=null;
  cam.x=P.x;cam.y=P.y;state='play';$('#menu').hidden=true;$('#hud').hidden=false;$('#btns').hidden=false;
  if(!save.tut3)tutStart();else{tut.on=false;$('#hint').hidden=true}
  
  if(!save.seenHelp4)openHelp();
}

/* ---------- bucle ---------- */
let lastTs=0;
function step(rdt){
  if(timeScale<1)timeScale=Math.min(1,timeScale+rdt*1.4);
  if(!paused)update(rdt*timeScale);
  const base=clamp(Math.min(W,H)/560,.55,1.3),tz=base*(1-.055*((P?P.tier:1)-1));
  zoomS.z+=(tz-zoomS.z)*Math.min(1,rdt*2.5);
  if(P){cam.x+=(P.x-cam.x)*Math.min(1,rdt*7);cam.y+=(P.y-cam.y)*Math.min(1,rdt*7)}
  else if(state==='menu'){cam.x+=((1400+Math.sin(T*.1)*500)-cam.x)*rdt;cam.y+=((WH/2+Math.cos(T*.13)*180)-cam.y)*rdt}
  const vh=H/zoomS.z;cam.y=clamp(cam.y,Math.min(vh/2-140,WH/2),Math.max(WH-vh/2+140,WH/2));
}
function frame(ts){
  requestAnimationFrame(frame);
  const rdt=Math.min(.05,(ts-lastTs)/1000||0);lastTs=ts;
  step(rdt);render();hud();
  if(state==='menu')drawPreviews(ts/1000);
  if(!$('#choose').hidden)drawChoose(ts/1000);
}
if(location.hash==='#prueba')window.__al={zTier,zoneIdx,get threat(){return threat},get NZ(){return NZ},get FOOD(){return FOOD},get POOLS(){return POOLS},step,render,hud,get P(){return P},get state(){return state},get BOTS(){return BOTS},get FA(){return FA},setClock:c=>{clock=c},lungeP,useSkill,keys,joy,save,tutNext,get tut(){return tut},setP:o=>Object.assign(P,o),levelUp:()=>{P.xp=need(P.lvl);gainXP(0,P.x,P.y)}};
resetWorld(1400);buildMenu();requestAnimationFrame(frame);
})();
</script>
